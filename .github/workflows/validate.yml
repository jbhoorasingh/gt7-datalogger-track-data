# Every contribution is checked against the bundle format this repository
# defines (tools/bundle_format.py), on a bare Python with nothing installed.
#
# The app implements the same format, so the two can drift. `app-agrees`
# is the guard for that, and it is a SEPARATE job on purpose: it installs the
# app from another repository's default branch, and a change made over there
# must not read as a contributor's pull request being broken.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The app moves on its own schedule, and drift that nobody has opened a
    # pull request to notice is exactly the drift worth catching.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every bundle
        run: python tools/validate.py

      # Two questions about the two derived files, and which is asked depends
      # on what started the run.
      #
      # A pull request no longer carries index.json or signatures.json: they
      # are rebuilt on main after every merge (reindex.yml, and the sync job
      # after its own), so that no two pull requests share a file. The copies
      # a pull request is checked out with are therefore main's, and on main
      # itself they are one merge behind for the few seconds until that
      # rebuild is committed. "Does the committed copy match" would fail every
      # pull request that adds a bundle and turn every merge red for nothing.
      # So a pull request and a push are asked only whether both files CAN be
      # built from this tree, which is what a contribution can still break.
      - name: index.json can be built from the bundles
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python tools/build_index.py --verify

      - name: signatures.json can be built from the bundles and the vendored captures
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python tools/build_signatures.py --verify

      # The strict question is kept for the weekly run and for one asked for
      # by hand. It is the backstop: a rebuild that stopped happening leaves
      # main's copies stale with nothing else to say so, and this is what
      # would. `gh workflow run reindex.yml` mends it.
      - name: index.json must match the bundles
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/build_index.py --check

      - name: signatures.json must match the bundles and the vendored captures
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/build_signatures.py --check

      - name: Test the bundle format's authored records
        run: python tools/test_bundle_format.py
      - name: Test the corrections format
        run: python tools/test_corrections.py
      - name: Test the signature build
        run: python tools/test_build_signatures.py

      - name: Test the vendoring
        run: python tools/test_vendor_captures.py

      - name: Test the local track editor launcher
        run: python tools/track_editor/test_launcher.py

      - name: Test talking to a running app
        run: python tools/test_app_client.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the track editor core
        run: node --test --experimental-test-isolation=none tools/track_editor/track-editor-core.test.mjs

      - name: Install unified tool dependencies
        run: python -m pip install -e ".[test]"

      - name: Test the unified CLI and GUI
        run: python tools/test_unified_interfaces.py

  app-agrees:
    name: the app still accepts what we ship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app
        run: |
          pip install "gt7-datalogger @ git+https://github.com/jbhoorasingh/gt7-datalogger@main#subdirectory=backend"

      - name: Hand every bundle to the app's own validator
        run: python tools/check_app_agrees.py
