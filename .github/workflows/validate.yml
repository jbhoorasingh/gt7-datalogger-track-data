# Every contribution is checked against the bundle format this repository
# defines (tools/bundle_format.py). Nothing to install: the format is v4 and
# the app reads v3, so there is no app-side validator to defer to.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate every bundle
        run: python tools/validate.py

      - name: index.json must match the bundles
        run: python tools/build_index.py --check
