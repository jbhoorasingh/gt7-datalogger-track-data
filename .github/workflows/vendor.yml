# Pull new circuits from upstream, as a pull request nobody has to remember to
# open.
#
# The captures under vendor/ are the only source for the 69 configurations
# nobody here has surveyed, and they are vendored rather than fetched at build
# time so a build is reproducible offline. That is the right trade, but it has
# a cost: the data only moves when somebody remembers to move it, and upstream
# adding a circuit is exactly the thing this repository exists to notice.
#
# So this refreshes on a schedule and lands it itself when everything is clean:
# the captures are re-vendored, the signatures rebuilt, the whole check suite
# run, and only then is it merged. Nothing about that is a judgement, so
# nothing about it needs a person.
#
# What does need a person is a capture that maps to no configuration — a new
# name upstream is either a circuit worth a row or a rename worth a line in
# CAPTURE_NAME_FIXES, and the file cannot tell which. That case, and any failing
# check, stops here and leaves a draft pull request with the re-vendored data
# already on its branch. The routine refresh is silent; the one carrying a
# question is the one that reaches you.
name: vendor

on:
  schedule:
    # Weekly, matching the app-drift check in validate.yml, an hour ahead of it
    # so a green Monday morning means both questions were asked.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To ask for pack and pages by name after merging — see the last step for
  # why they have to be asked rather than triggered.
  actions: write

concurrency:
  group: vendor
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-vendor from upstream
        id: vendor
        run: |
          set -euo pipefail
          python tools/vendor_captures.py | tee vendor.log
          if git diff --quiet -- vendor/circuits.json; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upstream has not moved
        if: steps.vendor.outputs.moved == 'false'
        run: echo "Nothing to pull. No pull request."

      # Not `set -e`: an unmapped capture is SUPPOSED to fail here. A new name
      # upstream is either a new configuration or a rename, and both are
      # decisions for a person — so the failure becomes the pull request's
      # subject rather than a red cron nobody opens.
      - name: Rebuild the signatures
        id: build
        if: steps.vendor.outputs.moved == 'true'
        run: |
          set +e
          python tools/build_signatures.py > signatures.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat signatures.log

      - name: Check it the way a pull request would be checked
        id: checks
        if: steps.vendor.outputs.moved == 'true'
        run: |
          # A pull request opened with GITHUB_TOKEN does not start workflows,
          # so validate.yml will NOT run on the one this job opens. Run the
          # same questions here, and put the answers in the body, or the pull
          # request would arrive with no checks and look as if it had passed.
          set +e
          ok=0
          check () {
            if "${@:2}" > /dev/null 2>&1; then
              echo "- $1: pass"
            else
              echo "- $1: **FAIL**"
              ok=1
            fi
          }
          # Redirected, never piped: the left-hand side of a pipeline runs in a
          # subshell, so `ok` would be set there and read back here as 0, and
          # every refresh would claim to have passed.
          {
            check "every bundle is valid" python tools/validate.py
            check "index.json matches the bundles" python tools/build_index.py --check
            check "signatures.json matches its inputs" python tools/build_signatures.py --check
            check "signature build tests" python tools/test_build_signatures.py
            check "vendoring tests" python tools/test_vendor_captures.py
          } > checks.log
          cat checks.log
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Land it, or ask for a decision
        if: steps.vendor.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
          CHECKS_OK: ${{ steps.checks.outputs.ok }}
        run: |
          set -euo pipefail
          branch=auto/vendor-captures
          clean=1
          if [ "$BUILD_STATUS" != "0" ] || [ "$CHECKS_OK" != "0" ]; then
            clean=0
          fi

          {
            echo "Upstream moved, so this is the refresh."
            echo
            echo "## What changed in \`vendor/circuits.json\`"
            echo
            echo '```'
            cat vendor.log
            echo '```'
            echo
            if [ "$clean" = "1" ]; then
              echo "## What that did to \`signatures.json\`"
            else
              echo "## :warning: This one needs a decision"
              echo
              if [ "$BUILD_STATUS" != "0" ]; then
                echo "The signature build refuses an upstream name it cannot"
                echo "place rather than skipping it, because a new name is"
                echo "either a configuration worth a row or a rename worth a"
                echo "line in \`CAPTURE_NAME_FIXES\` — and the file cannot tell"
                echo "which. Make that call on this branch and push; the"
                echo "re-vendored captures are already here."
              else
                echo "The refresh built, but a check below failed, so it was"
                echo "not merged."
              fi
            fi
            echo
            echo '```'
            cat signatures.log
            echo '```'
            echo
            echo "## Checks"
            echo
            cat checks.log
            echo
            echo "_Run in this job, not on the pull request: one opened with"
            echo "\`GITHUB_TOKEN\` does not start workflows, so \`validate\` will"
            echo "not run on it by itself. Pushing any commit of your own to"
            echo "this branch will start it._"
          } > body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add vendor/circuits.json signatures.json
          git commit -F- <<'MSG'
          Refresh the vendored captures from upstream

          Opened by .github/workflows/vendor.yml. What moved, and what it did
          to signatures.json, is in the pull request body.
          MSG
          git push --force origin "$branch"

          title="Refresh the vendored captures from upstream"
          if [ "$clean" != "1" ]; then
            title="$title (needs a decision)"
          fi

          if url=$(gh pr view "$branch" --json url --jq .url 2>/dev/null); then
            gh pr edit "$branch" --title "$title" --body-file body.md > /dev/null
          elif [ "$clean" = "1" ]; then
            url=$(gh pr create --base main --head "$branch" \
                    --title "$title" --body-file body.md)
          else
            url=$(gh pr create --base main --head "$branch" \
                    --title "$title" --body-file body.md --draft)
          fi
          echo "pull request: $url"

          if [ "$clean" != "1" ]; then
            echo "Left open. The build or a check needs a person."
            exit 0
          fi

          # A run that left a draft behind can be cleaned up by a later one.
          gh pr ready "$branch" > /dev/null 2>&1 || true

          # Mergeability is computed asynchronously, so a pull request created
          # a second ago is not always mergeable yet.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --delete-branch; then
              merged=1
              break
            fi
            echo "not mergeable yet (attempt $attempt)"
            sleep 10
          done
          if [ "${merged:-0}" != "1" ]; then
            echo "Could not merge. The pull request is open at $url."
            exit 1
          fi
          echo "merged"

          # A merge performed with GITHUB_TOKEN does NOT start workflows, so
          # main would carry signatures that the download pack and the site
          # never publish — the refresh would look done and be half done.
          # workflow_dispatch is the documented exception to that rule, so ask
          # for them by name.
          gh workflow run pack.yml --ref main
          gh workflow run pages.yml --ref main
          echo "asked pack and pages to republish"
