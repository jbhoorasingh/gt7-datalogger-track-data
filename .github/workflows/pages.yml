# The inspection site. Assembled rather than served from the repo root so the
# page sits at / and the bundles it fetches sit beside it, which keeps every
# path in the site relative and makes it work just as well opened locally.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # What is published is built from the bundles it is published with,
      # whatever the committed copies say at this commit. They are rebuilt on
      # main after every merge (reindex.yml) and no pull request carries them,
      # so at the commit a merge makes — the very one this runs on — they are
      # one merge behind, and copied as they stand the site would serve the
      # index from before the merge beside the bundles from after it. That is
      # not cosmetic: a datalogger pulls from this site, and finds a circuit's
      # bundle and its corrections by what index.json names.
      - name: Build index.json and signatures.json from the bundles being published
        run: |
          python tools/build_index.py
          python tools/build_signatures.py

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site/tracks
          cp site/index.html site/app.js site/style.css _site/
          cp index.json signatures.json _site/
          cp tracks/*.json _site/tracks/ 2>/dev/null || echo "no bundles yet"
          # The corrections beside them: index.json names each circuit's file,
          # and a datalogger pulling the bundle fetches it from the same place.
          mkdir -p _site/corrections
          cp corrections/*.json _site/corrections/ 2>/dev/null || echo "no corrections yet"
          # Jekyll would otherwise try to process this and drop the JSON.
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
