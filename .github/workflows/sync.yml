# Merge what the sync service collected, as pull requests nobody has to open.
#
# The sync service (sync.gt7-datalogger.com) accepts survey bundles from
# dataloggers and stores them; it never merges anything. This is the other
# half: nightly, and whenever the service's admin panel asks (its "Run job
# now" sends a workflow_dispatch here), tools/sync_job.py pulls the pending
# uploads, merges each circuit's into the bundle this repository holds,
# compiles the geometry with the datalogger's own compiler, judges the
# auto-merge gate, opens one pull request per changed circuit, merges it
# itself when the gate and the checks both pass and the administrator has
# switched auto-merge on, and tells the service what became of every upload.
#
# What needs a person stops here as an issue in the service's admin panel —
# a survey filed under a layout the geometry disagrees with, an update that
# would shrink the published perimeter, a pull request the gate declined —
# and comes back through the queue once they answer. The routine night is
# silent; the one carrying a question is the one that reaches you.
#
# Secrets: GT7_SYNC_SERVICE_KEY is the service key (rotate it from the
# service's Admin → Settings). GITHUB_TOKEN opens and merges the pull
# requests, and pushes the one commit described next. A merge made with
# GITHUB_TOKEN starts no workflow, so after each of its own the job does what
# a person's merge would have started: it rebuilds main's index.json and
# signatures.json and pushes them (reindex.yml's work — no pull request
# carries those two files), then asks pack.yml and pages.yml to republish by
# name.
name: sync

on:
  schedule:
    # 02:00 UTC, an hour before the service's own housekeeping sweep and
    # long after the evening's driving in every timezone that drives.
    - cron: "0 2 * * *"
  # When a PERSON merges or closes one of this job's pull requests. Nothing
  # else tells the sync service: left to the nightly run, a circuit merged at
  # lunchtime reads "awaiting review" until two in the morning, with its edit
  # unpublished. So the job runs now, for everything: it publishes what
  # landed, settles its row, and rebuilds the rest on the new main.
  #
  # There used to be a second reason. Every pull request rewrote index.json,
  # so a merge left every other open one conflicting until this run rebuilt
  # it — and a merge the job made later in the same run stranded them again
  # (2026-11-05, #98 and #107 behind #117). A pull request carries only its
  # own circuit's file now, so nothing landing for another circuit can
  # conflict it, and index.json and signatures.json are rebuilt on main after
  # the merge: by reindex.yml, which the same merge starts, and by this run
  # before it touches a circuit, whichever gets there first.
  #
  # (A merge the job makes itself starts nothing: GITHUB_TOKEN's events never
  # do, which is also why this cannot loop.)
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      official_id:
        description: "One configuration's official id, or blank for every circuit with pending uploads"
        required: false
        default: ""
      # The catch-up, for what a merge would not send: a corner somebody
      # renamed here by pull request, or a circuit published before the job
      # learned to send something. It needs the service key, which this
      # workflow already has, so it can be asked for here rather than run from
      # a machine that has to be given the key first. It opens no pull request
      # and reports nothing about uploads.
      publish_existing:
        description: "Instead of merging uploads: recompile and republish every circuit already here (geometry, corners, sections)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  merge:
    # On a closed pull request: only the job's own branches, and only from this
    # repository. A fork can name a branch `edit/anything`; it gets no secrets
    # on this event and would only fail, but it does not get to try.
    if: >-
      github.event_name != 'pull_request' ||
      ((startsWith(github.head_ref, 'sync/') || startsWith(github.head_ref, 'edit/')) &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The job works from main whatever started it. A closed pull
          # request's own ref is its test merge, which does not exist for one
          # that conflicted — and that is the very one this is here to mend.
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The compiler is the datalogger's, not this repository's, and the
      # job refuses to run without it rather than publish geometry it made
      # up. Same install as validate.yml's app-agrees job.
      - name: Install the datalogger, for its compiler
        run: |
          pip install "gt7-datalogger @ git+https://github.com/jbhoorasingh/gt7-datalogger@main#subdirectory=backend"

      - name: Test the job against this checkout
        run: python tools/test_sync_job.py

      - name: Merge, judge, and open pull requests
        env:
          GT7_SYNC_SERVICE_KEY: ${{ secrets.GT7_SYNC_SERVICE_KEY }}
          GT7_SYNC_URL: ${{ vars.GT7_SYNC_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.publish_existing }}" = "true" ]; then
            python tools/sync_job.py --publish-existing
          else
            python tools/sync_job.py --official-id "${{ inputs.official_id }}"
          fi
